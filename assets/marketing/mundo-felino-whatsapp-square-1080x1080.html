<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mundo Felino — Imagen WhatsApp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1080px; height: 1080px; overflow: hidden; background: #050b16; }
    body { font-family: "Plus Jakarta Sans", system-ui, sans-serif; }
    .canvas {
      position: relative;
      width: 1080px; height: 1080px;
      padding: 48px 56px 44px;
      background:
        radial-gradient(700px 700px at 92% -8%, rgba(44, 224, 255, 0.18), transparent 60%),
        radial-gradient(700px 700px at -8% 100%, rgba(34, 101, 255, 0.14), transparent 62%),
        linear-gradient(180deg, #07101f 0%, #050b16 100%);
    }
    .canvas::before {
      content: ""; position: absolute; inset: 0;
      background-image: linear-gradient(rgba(255,255,255,.028) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.028) 1px, transparent 1px);
      background-size: 56px 56px; pointer-events: none;
    }
    .content { position: relative; z-index: 1; height: 100%; display: flex; flex-direction: column; }
    .brand-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; }
    .brand { display: flex; align-items: center; gap: 14px; }
    .brand-mark { width: 58px; height: 58px; display: grid; place-items: center; border-radius: 18px; background: linear-gradient(145deg, #43e8ff, #2b6bff); }
    .brand-mark svg { width: 30px; height: 30px; fill: #04111f; }
    .brand-name { font-size: 32px; font-weight: 800; letter-spacing: -0.04em; color: #fff; }
    .brand-name b { color: #2ce0ff; }
    .city-chip { padding: 10px 18px; border-radius: 999px; border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.06); color: rgba(255,255,255,.8); font-size: 15px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
    .grid { display: grid; grid-template-columns: 1.1fr 1fr; gap: 34px; align-items: center; flex: 1 1 auto; min-height: 0; }
    .photo-card { position: relative; border-radius: 34px; overflow: hidden; border: 1px solid rgba(255,255,255,.15); height: 100%; max-height: 680px; box-shadow: 0 28px 70px rgba(0,0,0,.45); background: #0a1424; }
    .photo-card img { width: 100%; height: 100%; object-fit: cover; object-position: 52% 40%; display: block; }
    .headline h1 { font-size: 64px; line-height: 1.02; letter-spacing: -0.055em; font-weight: 800; color: #fff; margin-bottom: 22px; }
    .headline h1 em { font-style: normal; background: linear-gradient(100deg, #6ff1ff, #2ce0ff 50%, #4b8cff); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .headline p { font-size: 22px; line-height: 1.45; color: rgba(238,249,255,.76); font-weight: 500; max-width: 420px; }
    .cta { margin-top: 34px; padding: 22px 26px; border-radius: 22px; background: linear-gradient(110deg, #7df5ff, #2ce0ff 42%, #377dff); color: #03101e; box-shadow: 0 18px 48px rgba(24,178,255,.28); }
    .cta-kicker { display: block; font-size: 12px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; opacity: .75; margin-bottom: 6px; }
    .cta-url { font-size: 22px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.2; word-break: break-word; }
    .footer { display: flex; justify-content: space-between; align-items: center; padding-top: 20px; color: rgba(206,228,242,.5); font-size: 16px; font-weight: 600; }
  </style>
</head>
<body>
  <main class="canvas">
    <div class="content">
      <header class="brand-row">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg></span>
          <span class="brand-name">Mundo<b>Felino</b></span>
        </div>
        <span class="city-chip">Caracas</span>
      </header>
      <div class="grid">
        <div class="photo-card">
          <img src="../../frontend/mundo-felino-web/public/gatos/hero.jpg" alt="Gato negro de ojos verdes" />
        </div>
        <div class="headline">
          <h1>Un mundo <em>felino</em><br/>para tu gato.</h1>
          <p>Biblioteca de cuidados, clínicas en Caracas y el asistente Michi para tus dudas del día a día.</p>
          <div class="cta">
            <span class="cta-kicker">Visita la página</span>
            <span class="cta-url">mundofelino-efraingon.vercel.app</span>
          </div>
        </div>
      </div>
      <footer class="footer">
        <span>🐾 Hecho en Caracas</span>
        <span>Educativo · Gratis</span>
      </footer>
    </div>
  </main>
</body>
</html>
