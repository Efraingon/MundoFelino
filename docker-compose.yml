services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: mundofelino
      POSTGRES_USER: mundofelino_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Cambiar_Esta_Clave_Local_123!}
    ports:
      - "5432:5432"
    volumes:
      - mundofelino_pgdata:/var/lib/postgresql/data
      - ./database/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ./database/002_seed_articles.sql:/docker-entrypoint-initdb.d/002_seed_articles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mundofelino_app -d mundofelino"]
      interval: 10s
      timeout: 5s
      retries: 10
  ollama:
    image: ollama/ollama:latest
    profiles: ["ai"]
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
volumes:
  mundofelino_pgdata:
  ollama_data:
